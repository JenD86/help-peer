name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VPS_USER: help-peer
  APP_DIR: /home/help-peer/app

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull and rebuild on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_DIR"
          git pull --ff-only origin main
          docker compose up -d --build --remove-orphans
          docker image prune -f

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7000/health >/dev/null \
              && curl -fsS http://127.0.0.1:7001/health >/dev/null \
              && curl -fsS http://127.0.0.1:8123/api/health >/dev/null; then
              echo "Deployed $(git rev-parse --short HEAD), all services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy"
          docker compose ps
          docker compose logs --tail 50
          exit 1
          EOF
