services:
  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    environment:
      - RELAY_PORT=7000
      - RELAY_DIR=/data
    volumes:
      - relay-data:/data

  storage-node:
    build:
      context: ./storage-node
      dockerfile: Dockerfile
    ports:
      - "7001:7001"
    environment:
      - STORAGE_PORT=7001
      - STORAGE_DIR=/data
      - STORAGE_BACKEND=disk
      - STORAGE_CAPACITY=1073741824
      - STORAGE_TTL=86400
    volumes:
      - storage-data:/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - WEB_PORT=8080
      - RELAY_URL=http://relay:7000
      - STORAGE_NODES=http://storage-node:7001
      # How clients outside Docker reach the same node; written into manifests
      # so the CLI can receive transfers sent from the web UI.
      - STORAGE_NODES_PUBLIC=http://127.0.0.1:7001
      # Public URL for login links; set WEB_BASE_URL in .env for a real deployment
      - WEB_BASE_URL=${WEB_BASE_URL:-http://localhost:8080}
      - WEB_DATA_DIR=/data
    env_file:
      - .env
    volumes:
      - web-data:/data
    depends_on:
      - relay
      - storage-node

  # Example: S3-backed storage node
  # storage-node-s3:
  #   build:
  #     context: ./storage-node
  #     dockerfile: Dockerfile
  #   ports:
  #     - "7002:7002"
  #   environment:
  #     - STORAGE_PORT=7002
  #     - STORAGE_BACKEND=s3
  #     - STORAGE_CAPACITY=10737418240
  #     - S3_BUCKET=my-helppeer-bucket
  #     - S3_REGION=us-east-1
  #     - S3_ENDPOINT=http://minio:9000
  #     - S3_ACCESS_KEY=minioadmin
  #     - S3_SECRET_KEY=minioadmin
  #     - S3_PREFIX=shards

volumes:
  relay-data:
  storage-data:
  web-data:
