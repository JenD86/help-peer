services:
  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    environment:
      - RELAY_PORT=7000
      - RELAY_DIR=/data
    volumes:
      - relay-data:/data

  storage-node:
    build:
      context: ./storage-node
      dockerfile: Dockerfile
    ports:
      - "7001:7001"
    environment:
      - STORAGE_PORT=7001
      - STORAGE_DIR=/data
      - STORAGE_BACKEND=disk
      - STORAGE_CAPACITY=1073741824
      - STORAGE_TTL=86400
    volumes:
      - storage-data:/data

  # Example: S3-backed storage node
  # storage-node-s3:
  #   build:
  #     context: ./storage-node
  #     dockerfile: Dockerfile
  #   ports:
  #     - "7002:7002"
  #   environment:
  #     - STORAGE_PORT=7002
  #     - STORAGE_BACKEND=s3
  #     - STORAGE_CAPACITY=10737418240
  #     - S3_BUCKET=my-helppeer-bucket
  #     - S3_REGION=us-east-1
  #     - S3_ENDPOINT=http://minio:9000
  #     - S3_ACCESS_KEY=minioadmin
  #     - S3_SECRET_KEY=minioadmin
  #     - S3_PREFIX=shards

volumes:
  relay-data:
  storage-data:
