[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helppeer"
version = "0.1.0"
description = "Asynchronous ephemeral file transfer for AI model weights"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0",
    "blake3>=0.3",
    "requests>=2.28",
    "reedsolo>=1.7",
    "hkdf>=0.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
