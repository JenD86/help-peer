[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helppeer"
version = "0.1.0"
description = "Asynchronous ephemeral file transfer for AI model weights"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "JenD86"},
]
keywords = ["file-transfer", "ai", "model-weights", "safetensors", "p2p", "decentralized", "ephemeral"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cryptography>=41.0",
    "blake3>=0.3",
    "requests>=2.28",
    "urllib3>=1.26",
    "reedsolo>=1.7",
    "hkdf>=0.0.3",
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
helppeer = "helppeer.cli:main"

[project.urls]
Homepage = "https://github.com/JenD86/help-peer"
Repository = "https://github.com/JenD86/help-peer"
Issues = "https://github.com/JenD86/help-peer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helppeer = ["wordlist.txt"]
